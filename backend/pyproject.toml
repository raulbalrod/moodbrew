[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodbrew-backend"
version = "0.1.0"
description = "Recomendador de cafeterias de especialidad basado en pipeline multiagente."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.140.6",
    "uvicorn[standard]==0.51.0",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
