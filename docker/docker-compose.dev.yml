name: moodbrew-dev

services:
  app:
    build:
      target: dev
    volumes:
      - ../backend:/srv/backend
      - ../frontend/streamlit_app.py:/srv/streamlit_app.py

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/backend"
    env_file: ../backend/.env
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/srv/backend
