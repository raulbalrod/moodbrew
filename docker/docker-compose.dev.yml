name: moodbrew-dev

services:
  backend:
    build:
      target: dev
    volumes:
      - ../backend:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      target: dev
    volumes:
      - ../frontend:/app
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
