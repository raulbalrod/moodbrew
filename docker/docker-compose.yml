name: moodbrew

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod
    env_file: ../backend/.env
    ports:
      - '${FRONTEND_PORT:-8501}:8501'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    env_file: ../backend/.env
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
