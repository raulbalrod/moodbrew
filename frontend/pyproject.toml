[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodbrew-frontend"
version = "0.1.0"
description = "Interfaz Streamlit del recomendador de cafeterias de especialidad MoodBrew."
requires-python = ">=3.12"
dependencies = [
    "streamlit==1.60.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
]

[tool.setuptools]
py-modules = ["app"]
