services:
  - type: web
    name: moodbrew
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: LLM_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: LLM_MODEL
        value: gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
